# TorchServe config for the NES HttpSink baseline on the Pi.
#
# Bind on all interfaces so the sink (127.0.0.1) reaches it; expose Prometheus metrics
# on :8082 for process_torchserve_results.py to scrape.
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082
metrics_mode=prometheus

# Inference lanes, and MEASURED rather than argued. scripts/run_torchserve_workers.sh swept CWRU at
# 1/2/3 workers x 3 repetitions and one worker won on every axis: handler 81.9 ms vs 116.4 at three
# workers, e2e P95 151.9 vs 296.5, P99 181.2 vs 433.5, peak RSS 940 MB vs 2812, swap 275 MB vs 1681.
# Throughput was the offered 10.3 records/s throughout, so nothing was ever queueing for a second
# lane; the extra workers only added contention (the TorchServe query still runs NES's worker
# threads for decoding and windowing, so N workers means 3 + N runnable threads on 4 cores) and a
# second and third resident copy of the 190 MB model.
#
# So this is the baseline's best configuration, not a handicap. The HTTP sink still opens one
# connection per NES worker thread, so the CLIENT never limits how many requests are outstanding --
# run_systems.sh checks connections >= workers. Raise this with TS_WORKERS to re-sweep
# (enable_envvars_config=true below is what lets that env var win over this file).
default_workers_per_model=1

# The HttpSink is synchronous and sends one frame per request, so there is nothing to
# batch server-side. Leave dynamic batching OFF (do not set batchSize/maxBatchDelay).
number_of_netty_threads=2
job_queue_size=128

# Auto-load every archive in the model store at startup. run_systems.sh passes the model's
# own directory as --model-store, so this loads exactly the freshly built .mar regardless of
# the model name (nanodet, squeezedet, ...).
model_store=model_store
load_models=all

# Keep responses lean; disable the token-auth and management-side envelope niceties that
# add latency/noise to a localhost benchmark.
enable_envvars_config=true
disable_token_authorization=true
